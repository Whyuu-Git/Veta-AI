name: ai_research_companion
description: Aplikasi pendamping riset akademik berbasis AI.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Panggil API ke backend FastAPI
  http: ^1.2.0
  # State management sederhana (dipilih ketimbang Riverpod karena lebih mudah dipahami dulu)
  provider: ^6.1.2
  # Simpan JWT token dengan aman di device (bukan SharedPreferences biasa)
  flutter_secure_storage: ^9.2.2
  # Font Lora (judul) & Inter (body) sesuai desain mockup
  google_fonts: ^6.2.1
  # Ikon bottom nav (Home, Riset, Mentor, dst)
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
